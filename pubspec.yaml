name: campus_event_explorer
description: "BIM493 - Mobile Programming I | Assignment #1: Campus Event Explorer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/tech_hackathon.png
    - assets/images/cyber_workshop.png
    - assets/images/art_exhibition.png
    - assets/images/theater_festival.png
    - assets/images/campus_marathon.png
    - assets/images/basketball_cup.png
    - assets/fonts/LICENSE_NotoFonts.txt

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
